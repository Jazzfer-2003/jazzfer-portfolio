name: Deploy to InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3 || true
          sudo apt-get install -y -qq lftp

      - name: Deploy files via FTP
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" ftpupload.net <<'EOF'
          set ssl:check-hostname off
          set ftp:ssl-allow no
          set net:max-retries 3
          put wp-content/mu-plugins/jazzfer-deploy.php -o htdocs/wp-content/mu-plugins/jazzfer-deploy.php
          mirror --reverse --only-newer --verbose --no-perms wp-content/uploads/2026 htdocs/wp-content/uploads/2026
          mirror --reverse --only-newer --verbose --no-perms wp-content/uploads/certs htdocs/wp-content/uploads/certs
          put wp-content/uploads/custom.css -o htdocs/wp-content/uploads/custom.css
          put wp-content/uploads/custom.js -o htdocs/wp-content/uploads/custom.js
          put wp-content/uploads/nature.jpg -o htdocs/wp-content/uploads/nature.jpg
          put wp-content/uploads/Jazzfer-Inigo-Resume.pdf -o htdocs/wp-content/uploads/Jazzfer-Inigo-Resume.pdf
          bye
          EOF

      - name: Apply database updates
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ ! -f sql/deploy.sql ]; then echo "No sql/deploy.sql — skipping DB apply."; exit 0; fi
          pip install pycryptodome --quiet
          python3 - <<'PY'
          import json, os, re, urllib.request
          base = 'https://jazzfer.great-site.net'
          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) jazzfer-deploy/1.0'

          def solve_challenge():
              # InfinityFree gates requests behind a JS challenge that sets a
              # __test cookie (AES-128-CBC of three hex constants in the page).
              r = urllib.request.Request(base + '/', headers={'User-Agent': ua})
              html = urllib.request.urlopen(r, timeout=60).read().decode('utf-8', 'replace')
              vals = re.findall(r'toNumbers\("([0-9a-f]{32})"\)', html)
              if len(vals) < 3:
                  return None
              from Crypto.Cipher import AES
              key, iv, ct = (bytes.fromhex(v) for v in vals[:3])
              return AES.new(key, AES.MODE_CBC, iv).decrypt(ct).hex()

          cookie = None
          sql = open('sql/deploy.sql', encoding='utf-8').read()
          body = json.dumps({'sql': sql, 'token': os.environ['DEPLOY_TOKEN']}).encode('utf-8')
          last = ''
          for attempt in range(4):
              headers = {'Content-Type': 'application/json', 'User-Agent': ua}
              if cookie:
                  headers['Cookie'] = '__test=' + cookie
              req = urllib.request.Request(base + '/wp-json/jazzfer-deploy/v1/apply',
                                           data=body, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=180) as resp:
                      text = resp.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  print('HTTP', e.code, e.read().decode('utf-8', 'replace')[:500])
                  raise
              except Exception as e:
                  last = str(e)
                  cookie = solve_challenge()
                  if not cookie:
                      print('Could not solve challenge:', last)
                      raise
                  continue
              if text.lstrip().startswith('{'):
                  print(text[:4000])
                  break
              # Anti-bot challenge arrives as HTTP 200 HTML — solve and retry.
              print('challenge response, solving (attempt %d)' % (attempt + 1))
              cookie = solve_challenge()
              if not cookie:
                  print('Unexpected response and challenge could not be solved:')
                  print(text[:500])
                  raise SystemExit('deploy failed')
          else:
              raise SystemExit('deploy failed after retries: ' + last)
          PY
